<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ink Authority - Nova Era da Tatuagem</title>
  
  <style id="master-light-and-mobile-css">
    /* HIDE GOOGLE TRANSLATE BANNERS */
    .goog-te-banner-frame,
    iframe.goog-te-banner-frame,
    .skiptranslate,
    #goog-gt-tt,
    .goog-te-balloon-frame {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
    }
    body {
      top: 0px !important;
      position: static !important;
    }

    /* MOBILE RESPONSIVENESS & TOUCH OPTIMIZATIONS */
    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden !important;
        width: 100% !important;
      }

      /* Single column responsive grid for videos and cards on mobile */
      div[style*="display:grid"],
      div[style*="display: grid"] {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
        padding-left: 12px !important;
        padding-right: 12px !important;
      }

      /* Mobile typography bounds */
      h1 { font-size: clamp(24px, 7.5vw, 38px) !important; line-height: 1.15 !important; }
      h2 { font-size: clamp(20px, 6vw, 28px) !important; line-height: 1.2 !important; }
      p { font-size: clamp(14px, 4vw, 16px) !important; }

      /* Video containers on mobile */
      div[style*="aspect-ratio:16/9"],
      div[style*="aspect-ratio: 16/9"] {
        width: 100% !important;
        border-radius: 14px !important;
      }
    }

    /* MASTER LIGHT MODE - ABSOLUTE OVERRIDE FOR ALL CONTAINERS */
    html.light,
    html.light body,
    html.light #root,
    html.light main,
    html.light section,
    html.light article,
    html.light header,
    html.light footer,
    html.light nav,
    html.light div:not(.is-media-bg):not([style*="background-image"]) {
      background-color: #ffffff !important;
      background: #ffffff !important;
      color: #111116 !important;
      filter: none !important;
    }

    /* Override dark inline backgrounds and gradients in Light Mode */
    html.light [style*="background"],
    html.light [style*="linear-gradient"],
    html.light [style*="radial-gradient"] {
      background-color: #ffffff !important;
      background: #ffffff !important;
    }

    /* Fixed Navigation in Light Mode */
    html.light div[style*="position:fixed"],
    html.light header[style*="position:fixed"] {
      background: rgba(255, 255, 255, 0.95) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12) !important;
    }

    /* Cards and Container Boxes in Light Mode */
    html.light div[style*="border"],
    html.light section[style*="border"] {
      border-color: rgba(0, 0, 0, 0.12) !important;
      background-color: #f8f8fa !important;
    }

    /* Text Elements in Light Mode */
    html.light h1, html.light h2, html.light h3, html.light h4, html.light h5, html.light h6,
    html.light p, html.light span, html.light a, html.light li, html.light label, html.light strong, html.light b, html.light i {
      color: #111116 !important;
      -webkit-text-fill-color: #111116 !important;
      background-clip: initial !important;
      -webkit-background-clip: initial !important;
    }

    /* Keep media, images, video, iframe 100% natural without any filter */
    html.light img,
    html.light video,
    html.light iframe,
    html.light svg,
    html.light canvas,
    html.light image-slot,
    html.light .is-media-bg,
    html.light [style*="background-image"] {
      filter: none !important;
      opacity: 1 !important;
    }
  </style>

  <div id="google_translate_element_iframe" style="display:none !important"></div>
  <script>
    function googleTranslateElementInitIframe() {
      try {
        new google.translate.TranslateElement({ pageLanguage: 'pt', autoDisplay: false }, 'google_translate_element_iframe');
      } catch(e) {}
    }

    window.addEventListener('message', function(event) {
      if (!event.data) return;

      if (event.data.type === 'SET_THEME') {
        var isLight = event.data.theme === 'light';
        var rootEl = document.documentElement;
        var bodyEl = document.body;
        var mainEl = document.querySelector('main');
        
        if (isLight) {
          rootEl.classList.add('light'); rootEl.classList.remove('dark');
          if (bodyEl) { bodyEl.classList.add('light'); bodyEl.classList.remove('dark'); }
          if (mainEl) { mainEl.classList.add('light'); mainEl.classList.remove('dark'); }
          document.querySelectorAll('section').forEach(function(s) { s.classList.add('light'); });
        } else {
          rootEl.classList.add('dark'); rootEl.classList.remove('light');
          if (bodyEl) { bodyEl.classList.add('dark'); bodyEl.classList.remove('light'); }
          if (mainEl) { mainEl.classList.add('dark'); mainEl.classList.remove('light'); }
          document.querySelectorAll('section').forEach(function(s) { s.classList.remove('light'); });
        }
      }

      if (event.data.type === 'SET_LANG') {
        var targetLang = event.data.lang;
        var attempts = 0;
        var interval = setInterval(function() {
          attempts++;
          var selectField = document.querySelector('.goog-te-combo');
          if (selectField) {
            selectField.value = targetLang;
            selectField.dispatchEvent(new Event('change'));
            clearInterval(interval);
          } else if (attempts > 30) {
            clearInterval(interval);
          }
        }, 200);
      }
    });
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInitIframe"></script>

n-items:center;gap:16px;padding:20px 24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px\">\n          <span style=\"color:#dcdce2;font-size:24px\">✦<\/span>\n          <span style=\"font-family:'Jost',sans-serif;font-size:clamp(15px,2vw,18px);letter-spacing:.1em;color:#f0f0f3;text-transform:uppercase\">Converter mais clientes<\/span>\n        <\/div>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:20px 24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px\">\n          <span style=\"color:#dcdce2;font-size:24px\">✦<\/span>\n          <span style=\"font-family:'Jost',sans-serif;font-size:clamp(15px,2vw,18px);letter-spacing:.1em;color:#f0f0f3;text-transform:uppercase\">Aumentar sua percepção de valor<\/span>\n        <\/div>\n        <div style=\"display:flex;align-items:center;gap:16px;padding:20px 24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px\">\n          <span style=\"color:#dcdce2;font-size:24px\">✦<\/span>\n          <span style=\"font-family:'Jost',sans-serif;font-size:clamp(15px,2vw,18px);letter-spacing:.1em;color:#f0f0f3;text-transform:uppercase\">Criar mais oportunidades através da tatuagem<\/span>\n        <\/div>\n      <\/div>\n\n      <a href=\"#\" style=\"cursor:pointer;\" data-reveal=\"\" data-delay=\"300\" style=\"display:inline-block;padding:18px 36px;background:#f3f3f6;color:#08080a;border-radius:100px;font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;transition:transform .3s\" style-hover=\"transform:scale(1.04)\">QUERO CONSTRUIR MINHA AUTORIDADE<\/a>\n    <\/div>\n  <\/section>\n\n  <!-- MANIFESTO -->\n  <section style=\"position:relative;padding:clamp(90px,14vh,180px) 22px;background:#08080a\">\n    <div style=\"max-width:900px;margin:0 auto;text-align:center\">\n      <span data-reveal=\"\" style=\"font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:rgba(238,238,242,.42)\">O mercado virou<\u002Fspan>\n      <h2 data-reveal=\"\" data-delay=\"80\" style=\"margin:26px auto 0;max-width:820px;font-family:'Jost',sans-serif;font-weight:200;font-size:clamp(26px,4.6vw,54px);line-height:1.16;letter-spacing:.01em;color:#f3f3f6\">Não é sobre mercado saturado.<br>É sobre <span style=\"font-weight:500;font-family:'Jost',sans-serif;background:linear-gradient(180deg,#ffffff,#eaeaef 60%,#c9c9cf);-webkit-background-clip:text;background-clip:text;color:transparent\">posicionamento certo<\u002Fspan>.<\u002Fh2>\n      <p data-reveal=\"\" data-delay=\"160\" style=\"margin:34px auto 0;max-width:640px;font-weight:300;font-size:clamp(16px,2.3vw,20px);line-height:1.7;color:rgba(238,238,242,.66)\">A tatuagem ocupou espaços inimagináveis nos últimos anos. Mas os clientes não vêm mais até você — agora é você que precisa aprender a chegar até eles. Nunca faltou quem ensinasse técnica. Faltou alguém que <em style=\"font-style:normal;color:#f0f0f3\">vive tatuagem<\u002Fem> mostrar o caminho.<\u002Fp>\n    <\u002Fdiv>\n\n    <p data-reveal=\"\" style=\"margin:clamp(40px,7vh,72px) auto 0;max-width:640px;text-align:center;font-family:'Jost',sans-serif;font-weight:300;font-style:italic;font-size:clamp(18px,3vw,26px);line-height:1.4;color:#e8e8ec\">\"Seu trabalho pode ser bom. Mas se ninguém entende o seu valor, ele continua invisível.\"<\u002Fp>\n  <\u002Fsection>\n\n  <!-- CINEMATIC BAND -->\n  <section style=\"position:relative;height:clamp(460px,86vh,900px);overflow:hidden;background:#08080a\">\n    <div data-parallax=\"0.12\" style=\"position:absolute;inset:-16% 0;background-image:url(&quot;/isa-london.jpg&quot;);background-size:cover;background-position:center 25%\"-parallax=\"0.12\" style=\"position:absolute;inset:-16% 0;background-image:url(&quot;/foto-principal-isa.jpeg&quot;);background-size:cover;background-position:center 28%\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,10,.6),rgba(8,8,10,.22) 42%,rgba(8,8,10,.9))\"><\u002Fdiv>\n    <div style=\"position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px\">\n      <p data-reveal=\"\" style=\"margin:0;max-width:780px;font-family:'Jost',sans-serif;font-weight:200;font-size:clamp(26px,5.2vw,62px);line-height:1.14;color:#f4f4f7\">O cliente compra o <span style=\"font-style:italic;background:linear-gradient(180deg,#fff,#9a9aa0);-webkit-background-clip:text;background-clip:text;color:transparent\">artista<\u002Fspan> antes da arte.<\u002Fp>\n      <span data-reveal=\"\" data-delay=\"120\" style=\"margin-top:24px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(238,238,242,.62)\">Posicionamento é percepção<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TRIAD RINGS -->\n  <section style=\"position:relative;padding:clamp(90px,15vh,190px) 22px;background:linear-gradient(180deg,#08080a,#0b0b0e,#08080a);overflow:hidden\">\n    <div style=\"display:none\" data-parallax=\"0.08\" style=\"position:absolute;inset:0;background-image:url(&quot;\/espaco-3.jpeg&quot;);background-size:cover;background-position:center;opacity:.14;filter:blur(4px) grayscale(.4)\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:960px;margin:0 auto;text-align:center\">\n      <span data-reveal=\"\" style=\"font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:rgba(238,238,242,.42)\">O método<\u002Fspan>\n      <h2 data-reveal=\"\" data-delay=\"80\" style=\"margin:24px auto 10px;font-family:'Jost',sans-serif;font-weight:200;font-size:clamp(26px,4.4vw,50px);line-height:1.15;color:#f3f3f6\">Os três pilares para construir uma carreira sólida na tatuagem.<\u002Fh2>\n\n      <div id=\"venn\" data-reveal=\"\" data-delay=\"140\" style=\"position:relative;width:min(88vw,560px);height:min(88vw,560px);margin:clamp(36px,6vh,60px) auto clamp(30px,5vh,48px)\">\n        <svg sc-camel-view-box=\"0 0 400 400\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 22px rgba(206,206,220,.28))\">\n          <circle data-anim=\"\" cx=\"200\" cy=\"150\" r=\"124\" fill=\"none\" stroke=\"rgba(220,220,228,.62)\" stroke-width=\"1.1\" stroke-dasharray=\"780\" stroke-dashoffset=\"780\" style=\"animation:drawCircle 2.4s cubic-bezier(.6,.05,.25,1) forwards;animation-play-state:paused\"><\u002Fcircle>\n          <circle data-anim=\"\" cx=\"140\" cy=\"250\" r=\"124\" fill=\"none\" stroke=\"rgba(220,220,228,.62)\" stroke-width=\"1.1\" stroke-dasharray=\"780\" stroke-dashoffset=\"780\" style=\"animation:drawCircle 2.4s cubic-bezier(.6,.05,.25,1) forwards;animation-delay:.9s;animation-play-state:paused\"><\u002Fcircle>\n          <circle data-anim=\"\" cx=\"260\" cy=\"250\" r=\"124\" fill=\"none\" stroke=\"rgba(220,220,228,.62)\" stroke-width=\"1.1\" stroke-dasharray=\"780\" stroke-dashoffset=\"780\" style=\"animation:drawCircle 2.4s cubic-bezier(.6,.05,.25,1) forwards;animation-delay:1.8s;animation-play-state:paused\"><\u002Fcircle>\n        <\u002Fsvg>\n        <!-- convergence glow -->\n        <div data-anim=\"\" style=\"position:absolute;top:52%;left:50%;width:46%;height:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(212,212,226,.42),transparent 70%);filter:blur(8px);opacity:0;animation:glowPulse 6s ease-in-out infinite;animation-delay:4.4s;animation-play-state:paused\"><\u002Fdiv>\n        <!-- AUTORIDADE center (appears after circles) -->\n        <span data-anim=\"\" style=\"position:absolute;top:52%;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;font-family:'Jost',sans-serif;font-weight:300;font-size:clamp(20px,3.6vw,38px);letter-spacing:.16em;white-space:nowrap;background:linear-gradient(180deg,#ffffff,#d0d0d6 45%,#8f9096 62%,#f2f2f5);-webkit-background-clip:text;background-clip:text;color:transparent;animation:autoIn 1s cubic-bezier(.16,.7,.3,1) forwards;animation-delay:4.7s;animation-play-state:paused\">AUTORIDADE<\u002Fspan>\n        <!-- labels centered in each circle -->\n        <span data-anim=\"\" style=\"position:absolute;top:24%;left:50%;transform:translate(-50%,-50%);opacity:0;font-family:'Jost',sans-serif;font-size:clamp(10px,1.4vw,13px);letter-spacing:.24em;text-transform:uppercase;color:#e8e8ec;white-space:nowrap;animation:fadeIn .8s ease forwards;animation-delay:2.4s;animation-play-state:paused\">Posicionamento<\u002Fspan>\n        <span data-anim=\"\" style=\"position:absolute;top:72%;left:22%;transform:translate(-50%,-50%);opacity:0;font-family:'Jost',sans-serif;font-size:clamp(10px,1.4vw,13px);letter-spacing:.24em;text-transform:uppercase;color:#e8e8ec;white-space:nowrap;animation:fadeIn .8s ease forwards;animation-delay:3.3s;animation-play-state:paused\">Técnica<\u002Fspan>\n        <span data-anim=\"\" style=\"position:absolute;top:72%;left:78%;transform:translate(-50%,-50%);opacity:0;font-family:'Jost',sans-serif;font-size:clamp(10px,1.4vw,13px);letter-spacing:.24em;text-transform:uppercase;color:#e8e8ec;white-space:nowrap;animation:fadeIn .8s ease forwards;animation-delay:4.2s;animation-play-state:paused\">Estratégia<\u002Fspan>\n      <\u002Fdiv>\n\n      <p data-reveal=\"\" style=\"margin:0 auto;max-width:600px;font-weight:300;font-size:clamp(15px,2.2vw,19px);line-height:1.7;color:rgba(238,238,242,.62)\">A próxima geração de grandes tatuadores será formada por quem souber unir técnica, posicionamento e estratégia.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;margin-top:clamp(44px,7vh,72px);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;text-align:left\">\n        <div data-reveal=\"\" style=\"padding:clamp(26px,3vw,40px);background:#0a0a0c\">\n          <span style=\"font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.24em;color:rgba(210,210,218,.55)\">01<\u002Fspan>\n          <h3 style=\"margin:14px 0 12px;font-family:'Jost',sans-serif;font-weight:400;font-size:clamp(20px,2.4vw,27px);color:#f0f0f3\">Posicionamento<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;line-height:1.65;color:rgba(238,238,242,.6)\">Como você é percebido e lembrado pelos seus clientes.<\u002Fp>\n          <p style=\"margin:18px 0 0;padding-left:14px;border-left:1px solid rgba(210,210,218,.4);font-style:italic;font-size:14px;line-height:1.55;color:rgba(238,238,242,.52)\">\"O mercado não recompensa competência. Recompensa competência percebida.\"<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"80\" style=\"padding:clamp(26px,3vw,40px);background:#0a0a0c\">\n          <span style=\"font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.24em;color:rgba(200,168,120,.7)\">02<\u002Fspan>\n          <h3 style=\"margin:14px 0 12px;font-family:'Jost',sans-serif;font-weight:400;font-size:clamp(20px,2.4vw,27px);color:#f0f0f3\">Técnica<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;line-height:1.65;color:rgba(238,238,242,.6)\">Sem execução, todo o resto desmorona — mas hoje, sozinha, ela não é mais suficiente.<\u002Fp>\n          <p style=\"margin:18px 0 0;padding-left:14px;border-left:1px solid rgba(200,168,120,.5);font-style:italic;font-size:14px;line-height:1.55;color:rgba(238,238,242,.52)\">\"Técnica sem direção não te leva a lugar nenhum.\"<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"160\" style=\"padding:clamp(26px,3vw,40px);background:#0a0a0c\">\n          <span style=\"font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.24em;color:rgba(189,138,138,.75)\">03<\u002Fspan>\n          <h3 style=\"margin:14px 0 12px;font-family:'Jost',sans-serif;font-weight:400;font-size:clamp(20px,2.4vw,27px);color:#f0f0f3\">Estratégia<\u002Fh3>\n          <p style=\"margin:0;font-size:14px;line-height:1.65;color:rgba(238,238,242,.6)\">O jogo por trás de toda decisão: como você comunica, quem atende, quanto cobra, como converte. Nada por acaso.<\u002Fp>\n          <p style=\"margin:18px 0 0;padding-left:14px;border-left:1px solid rgba(189,138,138,.5);font-style:italic;font-size:14px;line-height:1.55;color:rgba(238,238,242,.52)\">\"Enquanto uns esperam o mercado mudar, outros decidem evoluir.\"<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SOBRE / AUTORIDADE (scrollytelling) -->\n  <section style=\"position:relative;background:#08080a;padding:clamp(70px,10vh,120px) 22px\">\n    <div style=\"max-width:1120px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:clamp(40px,6vw,72px)\">\n      <div style=\"text-align:center;max-width:760px;margin:0 auto\">\n        <span data-reveal=\"\" style=\"font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:rgba(238,238,242,.42)\">Quem conduz<\u002Fspan>\n        <h2 data-reveal=\"\" data-delay=\"80\" style=\"margin:22px 0 0;font-family:'Jost',sans-serif;font-weight:200;font-size:clamp(28px,5vw,58px);line-height:1.08;color:#f3f3f6\">Isabela Badini<\u002Fh2>\n        <p data-reveal=\"\" data-delay=\"140\" style=\"margin:18px auto 0;max-width:600px;font-weight:300;font-size:clamp(15px,2.2vw,19px);line-height:1.7;color:rgba(238,238,242,.62)\">Prazer, me chamo Isabela Badini, tatuo a mais de 10 anos e, assim como você, sou apaixonada pela tatuagem e muito grata por tudo que ela me proporcionou até hoje… e não foi só a técnica que me trouxe até aqui!<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(30px,5vw,64px);align-items:start\">\n        <!-- portrait + gallery -->\n        <div style=\"align-self:start\">\n          <div style=\"position:sticky;top:96px\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\">\n              <img src=\"\u002Fturma-work.jpeg\" style=\"width:100%;height:100%;object-fit:cover;display:block;\" \u002F>\n              <div style=\"position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 -80px 90px -40px rgba(8,8,10,.9)\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:14px\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\"><img src=\"\u002Fespaco-8.jpeg\" style=\"width:100%;height:100%;object-fit:cover;display:block;\" \u002F><\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\"><video id=\"cabelinho-video\" src=\"f6b7b514-7ac2-4b16-8980-71bbd0e0ecbf\"  muted=\"\" loop=\"\" playsinline=\"\" preload=\"metadata\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fvideo><\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\"><img src=\"\u002Ffoto-principal-isa.jpeg\" style=\"width:100%;height:100%;object-fit:cover;display:block;\" \u002F><\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\"><image-slot id=\"isa-londres2\" shape=\"rect\" src=\"5c504031-e96b-4ab7-817d-0e4d16b81237\" placeholder=\"Londres\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\"><image-slot id=\"isa-xuxa\" shape=\"rect\" src=\"46902831-9cdb-4703-882a-ef15cebe5e02\" placeholder=\"Isabela atendendo a Xuxa\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)\"><image-slot id=\"isa-orochi\" shape=\"rect\" src=\"724ebeb6-0b15-4417-832e-8f533194a825\" placeholder=\"Isabela e Orochi\"><\ hority. Você pode assistir quando e onde quiser.\n          <\/div>\n        <\/details>\n        \n        <details data-reveal=\"\" data-delay=\"100\" style=\"background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n          <summary style=\"padding:24px;font-family:'Jost',sans-serif;font-size:clamp(18px,2.2vw,22px);color:#f0f0f3;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center\">\n            Serve para quem está começando do zero? <span style=\"color:rgba(255,255,255,.4)\">+<\/span>\n          <\/summary>\n          <div style=\"padding:0 24px 24px;font-weight:300;font-size:16px;line-height:1.7;color:rgba(238,238,242,.66)\">\n            Sim! O método foi desenhado para te dar uma visão completa de posicionamento desde o início, evitando erros comuns e acelerando seu crescimento.\n          <\/div>\n        <\/details>\n\n        <details data-reveal=\"\" data-delay=\"200\" style=\"background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n          <summary style=\"padding:24px;font-family:'Jost',sans-serif;font-size:clamp(18px,2.2vw,22px);color:#f0f0f3;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center\">\n            Por quanto tempo terei acesso? <span style=\"color:rgba(255,255,255,.4)\">+<\/span>\n          <\/summary>\n          <div style=\"padding:0 24px 24px;font-weight:300;font-size:16px;line-height:1.7;color:rgba(238,238,242,.66)\">\n            Você terá acesso ilimitado ao conteúdo pelo período de 1 ano, incluindo todas as atualizações e aulas bônus que adicionarmos.\n          <\/div>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- FOOTER -->\n  <footer style=\"position:relative;background:#08080a;border-top:1px solid rgba(255,255,255,.06);padding:clamp(60px,9vh,110px) 22px 50px;text-align:center\">\n    <h2 style=\"margin:0;font-family:'Jost',sans-serif;font-weight:200;font-size:clamp(26px,6vw,64px);letter-spacing:clamp(.12em,1.6vw,.26em);background:linear-gradient(176deg,#ffffff,#d3d3d9 42%,#7c7d84 62%,#f4f4f7);-webkit-background-clip:text;background-clip:text;color:transparent\">INK&nbsp;AUTHORITY<\u002Fh2>\n    <div style=\"display:flex;align-items:center;justify-content:center;gap:14px;margin:20px auto 0;max-width:360px\">\n      <span style=\"height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(210,210,220,.4))\"><\u002Fspan>\n      <span style=\"font-size:14px;color:#9a9aa0\">✦<\u002Fspan>\n      <span style=\"height:1px;flex:1;background:linear-gradient(90deg,rgba(210,210,220,.4),transparent)\"><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:20px 0 0;font-weight:300;font-size:15px;color:rgba(238,238,242,.55)\">A nova era da tatuagem. Do tatuador para o tatuador.<\u002Fp>\n    <p style=\"margin:34px 0 0;font-size:12px;letter-spacing:.1em;color:rgba(238,238,242,.32)\">© Ink Authority · Isabela Badini<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:880},&quot;webhookUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Integração ManyChat&quot;,&quot;label&quot;:&quot;Webhook URL (recebe os leads)&quot;},&quot;whatsappLink&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Integração ManyChat&quot;,&quot;label&quot;:&quot;Link WhatsApp / ManyChat (pós-cadastro)&quot;},&quot;heroVideoUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mídia&quot;,&quot;label&quot;:&quot;URL do vídeo do topo (hero)&quot;},&quot;manifestoVideoUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Mídia&quot;,&quot;label&quot;:&quot;URL do vídeo manifesto (P&amp;B)&quot;}}\">\nclass Component extends DCLogic {\n  state = { submitted: false, sending: false };\n\n  componentDidMount() {\n    this.initReveal();\n    this.initParallax();\n    this.initDrag();\n    this.initVideo();\n    this.initVenn();\n    this.initClipVideo();\n  }\n\n  initClipVideo() {\n    const v = document.getElementById('cabelinho-video');\n    if (!v) return;\n    v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.removeAttribute('controls');\n    const p = v.play(); if (p && p.catch) p.catch(() => {});\n  }\n\n  initVenn() {\n    const venn = document.getElementById('venn');\n    if (!venn) return;\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          venn.querySelectorAll('[data-anim]').forEach(el => { el.style.animationPlayState = 'running'; });\n          io.disconnect();\n        }\n      });\n    }, { threshold: 0.35 });\n    io.observe(venn);\n  }\n\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n  }\n\n  initReveal() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(30px)';\n      el.style.transition = 'opacity 1.1s cubic-bezier(.16,.7,.3,1), transform 1.1s cubic-bezier(.16,.7,.3,1)';\n      el.style.transitionDelay = (el.getAttribute('data-delay') || '0') + 'ms';\n    });\n    this._io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this._io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    els.forEach(el => this._io.observe(el));\n  }\n\n  initParallax() {\n    const els = Array.from(document.querySelectorAll('[data-parallax]'));\n    if (!els.length) return;\n    const update = () => {\n      const vh = window.innerHeight;\n      els.forEach(el => {\n        const r = el.getBoundingClientRect();\n        const center = r.top + r.height / 2;\n        const off = center - vh / 2;\n        const sp = parseFloat(el.getAttribute('data-parallax')) || 0.1;\n        el.style.transform = 'translate3d(0,' + (-off * sp).toFixed(1) + 'px,0)';\n      });\n    };\n    let ticking = false;\n    this._onScroll = () => {\n      if (ticking) return;\n      ticking = true;\n      window.requestAnimationFrame(() => { update(); ticking = false; });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    update();\n  }\n\n  initDrag() {\n    const rail = document.getElementById('ia-rail');\n    if (!rail) return;\n    let down = false, startX = 0, startLeft = 0, moved = false;\n    rail.addEventListener('pointerdown', e => {\n      down = true; moved = false; startX = e.clientX; startLeft = rail.scrollLeft;\n      rail.style.cursor = 'grabbing';\n    });\n    rail.addEventListener('pointermove', e => {\n      if (!down) return;\n      const dx = e.clientX - startX;\n      if (Math.abs(dx) > 4) moved = true;\n      rail.scrollLeft = startLeft - dx;\n    });\n    const up = () => { down = false; rail.style.cursor = 'grab'; };\n    rail.addEventListener('pointerup', up);\n    rail.addEventListener('pointerleave', up);\n    rail.addEventListener('pointercancel', up);\n    rail.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);\n  }\n\n  fillVideo(boxId, url) {\n    if (!url) return;\n    const box = document.getElementById(boxId);\n    if (!box) return;\n    box.innerHTML = '';\n    box.style.filter = 'none';\n    const v = document.createElement('video');\n    v.src = url; v.controls = true; v.playsInline = true; v.preload = 'metadata';\n    v.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';\n    box.appendChild(v);\n  }\n\n  initVideo() {\n    this.fillVideo('hero-video', this.props.heroVideoUrl);\n    this.fillVideo('ia-video', this.props.manifestoVideoUrl);\n  }\n\n  async handleSubmit(e) {\n    e.preventDefault();\n    if (this.state.sending) return;\n    const data = Object.fromEntries(new FormData(e.target).entries());\n    this.setState({ sending: true });\n    const url = this.props.webhookUrl;\n    if (url) {\n      try {\n        await fetch(url, {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ ...data, source: 'landing-ink-authority', ts: new Date().toISOString() })\n        });\n      } catch (err) { /* silent — still confirm to lead */ }\n    }\n    try { localStorage.setItem('ia_lead', JSON.stringify(data)); } catch (err) {}\n    this.setState({ submitted: true, sending: false });\n  }\n\n  renderVals() {\n    return {\n      onSubmit: (e) => this.handleSubmit(e),\n      showForm: !this.state.submitted,\n      showSuccess: this.state.submitted,\n      waLink: this.props.whatsappLink || '#lista'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
